rox_vda5050_adapter:
  ros__parameters:
    # Raspberry Pi MQTT broker / master control
    mqtt_host: "192.168.1.115"
    mqtt_port: 1883
    mqtt_username: ""
    mqtt_password: ""
    mqtt_keepalive: 20

    # VDA 5050 identity: must match configs/fleet_control.env on the Pi.
    interface_name: "vda5050"
    major_version: "v3"
    protocol_version: "3.0.0"
    manufacturer: "neobotix"
    serial_number: "rox_diff_1"

    # Replace after making the new ROX-Diff map.
    map_id: "warehouse_case_study"
    map_version: "1.0"
    map_frame: "map"
    base_frame: "base_link"

    # Neobotix / Nav2 ROS interfaces. Verify with scripts/check_rox_ros_interfaces.sh.
    odom_topic: "/odom"
    battery_topic: "/battery_state"
    emergency_stop_topic: "/emergency_stop_state"
    safety_state_topic: "/safety_state"
    initial_pose_topic: "/initialpose"
    nav2_action_name: "/navigate_to_pose"

    state_rate_hz: 2.0
    validate_messages: true
    schema_package: "vda5050_schemas_v3"
    schema_directory: ""
    # Empty means the installed package template is used. Replace its unknown
    # physical values before relying on it for planning or capability selection.
    factsheet_file: ""

    # First order node is treated as already reached when the robot is within this range.
    initial_node_tolerance_m: 0.35

    # Set true before driving real hardware to test MQTT/order/state logic without Nav2 motion.
    dry_run_navigation: true
    dry_run_delay_s: 1.0
