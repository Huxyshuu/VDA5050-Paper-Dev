[package]
name = "vda5050_connector"
version = "1.1.1"
edition = "2021"

[dependencies]
rosidl_runtime_rs = "0.6"
serde = { version = "1", optional = true, features = ["derive"] }
serde-big-array = { version = "0.5.1", optional = true }

# ROS Dependencies
std_msgs = "*"
geometry_msgs = "*"
action_msgs = "*"
vda5050_msgs = "*"
unique_identifier_msgs = "*"
builtin_interfaces = "*"

[features]
serde = ['dep:serde', 'dep:serde-big-array', 'rosidl_runtime_rs/serde', 'std_msgs/serde', 'geometry_msgs/serde', 'action_msgs/serde', 'vda5050_msgs/serde', 'unique_identifier_msgs/serde', 'builtin_interfaces/serde']

[package.metadata.ros-env]
include = true
